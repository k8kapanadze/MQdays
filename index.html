
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carpe Diem Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.98);
            --accent: #3b82f6;
            --bg: #f8fafc;
            --dark-navy: #0f172a;
            --border-color: #cbd5e1; /* უფრო მკვეთრი ნაცრისფერი ხაზებისთვის */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); min-height: 100vh; padding: 10px; color: #1e293b; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }

        /* Main UI Elements */
        .glass-card {
            background: var(--glass);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .section-title { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; display: block; }
        input, select { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #e2e8f0; outline: none; font-size: 1rem; margin-bottom: 10px; background: white; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--dark-navy); color: white; }
        .btn-secondary { background: white; border: 1px solid #e2e8f0; color: #1e293b; }
        
        /* Table Styles */
        .table-card { padding: 0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--dark-navy); color: white; padding: 12px 5px; font-size: 0.65rem; text-transform: uppercase; }
        td { padding: 12px 2px; text-align: center; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .carpe-diem-btn {
            font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
            color: #94a3b8; background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 10px;
            border-radius: 8px; cursor: pointer; display: inline-block;
        }
        .carpe-diem-btn.has-note { background: var(--dark-navy); color: #ffffff; border-color: var(--dark-navy); }

        /* --- ARCHIVE & PDF RE-DESIGN --- */
        #archivePage {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 2000; overflow-y: auto;
        }
        .archive-header-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: #fff; border-bottom: 2px solid var(--dark-navy);
            position: sticky; top: 0; z-index: 10;
        }
        
        #pdfContent { 
            padding: 40px 60px; 
            max-width: 850px; 
            margin: 0 auto;
            background: white;
        }
        
        .pdf-header { 
            text-align: center; 
            margin-bottom: 60px; 
            padding-bottom: 20px; 
            border-bottom: 3px double var(--dark-navy); 
        }
        .pdf-header h1 { font-size: 26px; font-weight: 800; color: #000; margin-bottom: 5px; text-transform: uppercase; }
        .pdf-header p { font-size: 14px; color: #475569; letter-spacing: 3px; }

        /* მკვეთრი ზღვარი დღეებს შორის */
        .archive-item { 
            margin-bottom: 40px; 
            padding-bottom: 10px;
            page-break-inside: avoid;
        }
        
        /* თარიღის ბლოკი მკვეთრი ხაზით */
        .archive-date-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .archive-date { 
            font-weight: 900; 
            color: #000; 
            font-size: 1rem; 
            white-space: nowrap;
            padding-right: 15px;
        }
        .date-line {
            flex-grow: 1;
            height: 2px;
            background-color: var(--dark-navy); /* მკვეთრი შავი ხაზი */
        }
        
        .archive-note { 
            color: #111; 
            font-size: 1.15rem; 
            line-height: 1.9; 
            white-space: pre-wrap;
            text-align: justify;
            padding-left: 5px;
        }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: white; max-width: 450px; margin: 40px auto; padding: 25px; border-radius: 28px; }
        textarea { width: 100%; border-radius: 16px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; margin: 15px 0; font-size: 1.1rem; resize: none; outline: none; min-height: 250px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container" id="mainView">
    <div class="glass-card">
        <span class="section-title">მართვის პანელი</span>
        <input type="text" id="nurseName" placeholder="თქვენი სახელი და გვარი..." oninput="save()">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <select id="mSelect" onchange="render()"></select>
            <select id="ySelect" onchange="render()"></select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
            <input type="number" id="realDay" placeholder="რიცხვი">
            <select id="realHours">
                <option value="0">0</option>
                <option value="8">8 სთ</option>
                <option value="16">16 სთ</option>
                <option value="24">24 სთ</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="saveReal()">საათის დაფიქსირება</button>
        <button class="btn btn-secondary" onclick="openArchive()">📂 პირადი დღიურის ნახვა</button>
    </div>

    <div class="glass-card table-card">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">#</th>
                    <th style="width: 25%;">გეგმა</th>
                    <th style="width: 25%;">რეალ.</th>
                    <th style="width: 35%;">დღიური</th>
                </tr>
            </thead>
            <tbody id="bTable"></tbody>
        </table>
    </div>
</div>

<div id="archivePage">
    <div class="archive-header-nav">
        <button class="btn btn-secondary" style="width: auto; margin-bottom:0; padding: 8px 15px;" onclick="closeArchive()">⬅ უკან</button>
        <button class="btn btn-primary" style="width: auto; margin-bottom:0; padding: 8px 15px;" onclick="downloadPDF()">📄 PDF ჩამოტვირთვა</button>
    </div>
    <div id="pdfContent">
        <div class="pdf-header">
            <h1 id="pdfUserName"></h1>
            <p id="pdfDateRange"></p>
        </div>
        <div id="archiveList"></div>
    </div>
</div>

<div id="jModal" class="modal">
    <div class="modal-content">
        <h3 id="jTitle" style="font-weight: 800;"></h3>
        <textarea id="jText" placeholder="ჩაწერეთ თქვენი დღის ისტორია..."></textarea>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex:1" onclick="closeM()">გაუქმება</button>
            <button class="btn btn-primary" style="flex:1" onclick="saveJ()">შენახვა</button>
        </div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('nurse_v15')) || { name: "", shifts: {} };
    const months = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
    let activeKey = null;

    function init() {
        const ms = document.getElementById('mSelect'), ys = document.getElementById('ySelect');
        months.forEach((m, i) => ms.add(new Option(m, i)));
        for(let y=2025; y<=2030; y++) ys.add(new Option(y, y));
        ms.value = new Date().getMonth();
        ys.value = new Date().getFullYear();
        document.getElementById('nurseName').value = state.name || "";
        render();
    }

    function render() {
        const m = parseInt(document.getElementById('mSelect').value), y = parseInt(document.getElementById('ySelect').value);
        const days = new Date(y, m + 1, 0).getDate();
        let bHTML = "";

        for(let d=1; d<=days; d++) {
            const k = `d_${y}_${m}_${d}`, s = state.shifts[k] || {};
            bHTML += `<tr>
                <td class="day-num">${d}</td>
                <td><select class="plan-select" onchange="upd('${k}','plan',this.value)">
                    <option value=""></option><option value="8" ${s.plan=='8'?'selected':''}>8</option>
                    <option value="16" ${s.plan=='16'?'selected':''}>16</option><option value="24" ${s.plan=='24'?'selected':''}>24</option>
                </select></td>
                <td><div class="real-val">${s.real || '—'}</div></td>
                <td><div class="carpe-diem-btn ${s.note?'has-note':''}" onclick="openM('${k}',${d})">Carpe diem</div></td>
            </tr>`;
        }
        document.getElementById('bTable').innerHTML = bHTML;
    }

    function saveReal() {
        const d = document.getElementById('realDay').value, h = document.getElementById('realHours').value;
        const m = document.getElementById('mSelect').value, y = document.getElementById('ySelect').value;
        if(!d || d<1 || d>31) return alert("მიუთითეთ სწორი რიცხვი");
        const k = `d_${y}_${m}_${d}`;
        if(!state.shifts[k]) state.shifts[k] = {};
        state.shifts[k].real = h; save(); render();
    }

    function openArchive() {
        const m = document.getElementById('mSelect').value, y = document.getElementById('ySelect').value;
        document.getElementById('pdfUserName').innerText = state.name || "პირადი დღიური";
        document.getElementById('pdfDateRange').innerText = months[m] + " " + y;
        
        let listHTML = "";
        for(let d=1; d<=31; d++) {
            const k = `d_${y}_${m}_${d}`;
            if(state.shifts[k]?.note) {
                listHTML += `
                <div class="archive-item">
                    <div class="archive-date-wrapper">
                        <span class="archive-date">${d} ${months[m]}</span>
                        <div class="date-line"></div>
                    </div>
                    <div class="archive-note">${state.shifts[k].note}</div>
                </div>`;
            }
        }
        document.getElementById('archiveList').innerHTML = listHTML || "<p style='text-align:center; padding:50px; color:#94a3b8;'>ამ თვეში ჩანაწერები არ არის.</p>";
        document.getElementById('archivePage').style.display = 'block';
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        const opt = {
            margin: 0,
            filename: `Daybook_${months[document.getElementById('mSelect').value]}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 3, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    function closeArchive() { document.getElementById('archivePage').style.display = 'none'; }
    function openM(k, d) { activeKey = k; const m = document.getElementById('mSelect').value; document.getElementById('jTitle').innerText = `${d} ${months[m]}`; document.getElementById('jText').value = state.shifts[k]?.note || ""; document.getElementById('jModal').style.display='block'; }
    function saveJ() { if(!state.shifts[activeKey]) state.shifts[activeKey]={}; state.shifts[activeKey].note = document.getElementById('jText').value; save(); render(); closeM(); }
    function closeM() { document.getElementById('jModal').style.display='none'; }
    function upd(k, f, v) { if(!state.shifts[k]) state.shifts[k]={}; state.shifts[k][f]=v; save(); render(); }
    function save() { state.name = document.getElementById('nurseName').value; localStorage.setItem('nurse_v15', JSON.stringify(state)); }

    init();
</script>
</body>
</html>
